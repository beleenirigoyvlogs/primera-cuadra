<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Prospección 100 Locales | Pilar & Nordelta | Primera Cuadra</title>
  <meta name="description" content="Dashboard de prospección comercial directa para comercios de Pilar, Nordelta y Zona Norte sin página web propia. Mensajes personalizados con 1 clic a WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-purple: #673de6;
      --brand-purple-dark: #5025d1;
      --brand-purple-light: #f3f0ff;
      --brand-purple-soft: #ede9fe;
      --brand-purple-glow: rgba(103, 61, 230, 0.25);
      --green-wa: #25d366;
      --green-wa-dark: #128c7e;
      --green-wa-light: #e8f8f0;
      --text-dark: #0f172a;
      --text-title: #1e293b;
      --text-body: #334155;
      --text-muted: #64748b;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
      --border-focus: #c4b5fd;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-card: 0 4px 14px rgba(0,0,0,0.05);
      --shadow-hover: 0 10px 25px rgba(103, 61, 230, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-light);
      color: var(--text-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* Top Bar */
    .top-header {
      background: linear-gradient(135deg, #140d2b 0%, #1e133d 100%);
      color: #ffffff;
      padding: 24px 20px;
      border-bottom: 1px solid rgba(147, 51, 234, 0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .top-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand-group h1 {
      font-family: var(--font-heading);
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .brand-group p {
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .campaign-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px;
      border-radius: var(--radius-full);
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .campaign-tab {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .campaign-tab:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    .campaign-tab.active {
      background: var(--brand-purple);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(103, 61, 230, 0.4);
    }

    /* Main Container */
    .main-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* KPI Metrics Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: #ffffff;
      padding: 18px 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .kpi-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .kpi-icon.total { background: #eff6ff; color: #3b82f6; }
    .kpi-icon.sent { background: #fef3c7; color: #d97706; }
    .kpi-icon.chat { background: #dbeafe; color: #2563eb; }
    .kpi-icon.won { background: #dcfce7; color: #16a34a; }

    .kpi-info strong {
      display: block;
      font-family: var(--font-heading);
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.1;
    }

    .kpi-info span {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Filters Section */
    .filter-card {
      background: #ffffff;
      padding: 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .filter-top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-box-wrap {
      flex: 2 1 280px;
      position: relative;
    }

    .search-icon-svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.95rem;
      background: #ffffff;
      transition: all 0.2s ease;
      color: var(--text-dark);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--brand-purple);
      box-shadow: 0 0 0 3px var(--brand-purple-glow);
    }

    .select-wrap {
      flex: 1 1 180px;
    }

    .custom-select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.92rem;
      background: #ffffff;
      color: var(--text-dark);
      cursor: pointer;
      font-weight: 600;
    }

    .custom-select:focus {
      outline: none;
      border-color: var(--brand-purple);
    }

    .category-pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-pill-btn {
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-body);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cat-pill-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .cat-pill-btn.active {
      background: var(--brand-purple);
      color: #ffffff;
      border-color: var(--brand-purple);
      box-shadow: 0 2px 8px var(--brand-purple-glow);
    }

    /* Leads Grid */
    .leads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    .lead-card {
      background: #ffffff;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .lead-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-focus);
    }

    .lead-card.status-invalido {
      opacity: 0.65;
      background: #fdf2f2;
      border-color: #fecaca;
    }

    .lead-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .lead-title-box h3 {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .lead-meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge-chip {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-chip.profile {
      background: #fdf4ff;
      color: #9333ea;
      border: 1px solid #f0abfc;
      font-weight: 800;
    }

    .badge-chip.rubro {
      background: var(--brand-purple-light);
      color: var(--brand-purple-dark);
    }

    .badge-chip.zone {
      background: #f1f5f9;
      color: #475569;
    }

    .badge-chip.web-status {
      background: #fef2f2;
      color: #b91c1c;
    }

    .badge-chip.mobile-wa {
      background: var(--green-wa-light);
      color: var(--green-wa-dark);
    }

    .badge-chip.phone-landline {
      background: #f8fafc;
      color: #64748b;
      border: 1px solid #cbd5e1;
    }

    .status-badge-select {
      padding: 5px 8px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      background-color: #ffffff;
    }

    .status-badge-select.pendiente { background-color: #f8fafc; color: #475569; }
    .status-badge-select.enviado { background-color: #fef3c7; color: #b45309; }
    .status-badge-select.conversacion { background-color: #dbeafe; color: #1d4ed8; }
    .status-badge-select.cerrado { background-color: #dcfce7; color: #15803d; }
    .status-badge-select.invalido { background-color: #fee2e2; color: #b91c1c; }

    .lead-address {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    
    .lead-links-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-web-visit {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #0369a1;
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .btn-web-visit:hover {
      background: #bae6fd;
      color: #0284c7;
      text-decoration: underline;
    }

    .btn-call-direct {
      flex: 1;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }

    .btn-call-direct:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .btn-gmaps {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--brand-purple);
      text-decoration: none;
      margin-bottom: 12px;
      transition: color 0.15s;
    }

    .btn-gmaps:hover {
      color: var(--brand-purple-dark);
      text-decoration: underline;
    }

    .lead-diagnosis {
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      padding: 8px 12px;
      font-size: 0.82rem;
      color: #475569;
      border-radius: 0 6px 6px 0;
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .pitch-box-preview {
      background: #fdfdfd;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.78rem;
      color: #334155;
      line-height: 1.45;
      max-height: 130px;
      overflow-y: auto;
      margin-bottom: 14px;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .lead-actions-row {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn-wa-direct {
      flex: 1;
      background: var(--green-wa);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(37, 211, 102, 0.3);
    }

    .btn-wa-direct:hover {
      background: #20bd5a;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
    }

    .btn-copy-pitch {
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      color: var(--text-body);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-copy-pitch:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-copy-pitch:active {
      background: var(--brand-purple-light);
      color: var(--brand-purple);
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10000;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-color);
    }

    @media (max-width: 768px) {
      .leads-grid { grid-template-columns: 1fr; }
      .filter-top-row { flex-direction: column; }
      .brand-group h1 { font-size: 1.45rem; }
      .campaign-tabs { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">

      <div class="kpi-card">

            <option value="franquicia_cadena">🏢 Franquicias / Cadenas</option>
          </select>
        </div>

        <div class="select-wrap">
          <select id="zoneSelect" class="custom-select">
            <!-- Populated dynamically -->
          </select>
        </div>

        <div class="select-wrap">
          <select id="statusFilterSelect" class="custom-select">
            <option value="all">⚡ Todos los Estados</option>
            <option value="pendiente">⏳ Pendiente</option>
            <option value="enviado">📤 Mensaje Enviado</option>
            <option value="conversacion">💬 En Conversación</option>
            <option value="cerrado">🎉 Cerrado / Cliente</option>

  <!-- Toast -->

%20hoy%20y%20una%20maqueta%20de%20c%C3%B3mo%20quedar%C3%ADa%20optimizada%20para%20captar%20m%C3%A1s%20clientes%20en%20Pilar%3F%20Es%20sin%20compromiso.", "webBadge": "❌ Sin Web"}]
    };

    let activeCampaign = 'escobar';
    let activeCategory = 'all';

    function getStorageKey() {
      return `crm_statuses_${activeCampaign}`;
    }

    function getStatuses() {
      try {
        return JSON.parse(localStorage.getItem(getStorageKey())) || {};
      } catch (e) {
        return {};
      }
    }

    function saveStatus(id, newStatus) {
      const st = getStatuses();
      st[id] = newStatus;
      localStorage.setItem(getStorageKey(), JSON.stringify(st));
      updateKpis();
    }

    function handleWaClick(id) {
      const current = getStatuses()[id];
      if (!current || current === 'pendiente') {
        saveStatus(id, 'enviado');
        const sel = document.getElementById(`status-${id}`);
        if (sel) {
          sel.value = 'enviado';
          sel.className = 'status-badge-select enviado';
        }
      }
    }

    function copyPitch(id) {
      const currentLeads = DATASETS[activeCampaign];
      const lead = currentLeads.find(l => l.id === id);
      if (!lead) return;

      navigator.clipboard.writeText(lead.pitch).then(() => {
        showToast("✓ Mensaje de Ricardo copiado al portapapeles");
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = lead.pitch;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast("✓ Mensaje copiado");
      });
    }

    function showToast(text) {
      const t = document.getElementById('toast');
      t.innerHTML = `<span>${text}</span>`;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function updateKpis() {
      const leads = DATASETS[activeCampaign];
      const st = getStatuses();

      let sent = 0;
      let chat = 0;
      let won = 0;

      leads.forEach(l => {
        const s = st[l.id];
        if (s === 'enviado') sent++;
        else if (s === 'conversacion') chat++;
        else if (s === 'cerrado') won++;
      });

      document.getElementById('kpi-total').textContent = leads.length;
      document.getElementById('kpi-sent').textContent = sent;
      document.getElementById('kpi-chat').textContent = chat;
      document.getElementById('kpi-won').textContent = `${won} (${won * 250}k)`;
    }

    function populateFilters() {
      const leads = DATASETS[activeCampaign];
      
      // Zones
      const uniqueZones = [...new Set(leads.map(l => l.zone).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      const zones = ['all', ...uniqueZones];
      const zoneSelect = document.getElementById('zoneSelect');
      zoneSelect.innerHTML = zones.map(z => {
        const label = z === 'all' ? '📍 Todas las Zonas' : `📍 ${z}`;
        return `<option value="${z}" ${z === 'all' ? 'selected' : ''}>${label}</option>`;
      }).join('');
      zoneSelect.value = 'all';

      // Categories
      const catCounts = {};
      leads.forEach(l => {
        const c = l.category;
        catCounts[c] = (catCounts[c] || 0) + 1;
      });

      const catPillsRow = document.getElementById('catPillsRow');
      let pillsHtml = `<button type="button" class="cat-pill-btn ${activeCategory === 'all' ? 'active' : ''}" data-cat="all">Todos (${leads.length})</button>`;

      const catNames = {
        automotor: '🚗 Automotor & Mecánica',
        gastronomia: '🍕 Gastronomía & Bares',
        veterinarias: '🐾 Veterinarias & Pets',
        muebles: '🛋️ Hogar & Mueblerías',
        aberturas: '🚪 Aberturas & Vidrierías',
        construccion: '🧱 Construcción & Corralones',
        piscinas: '🏊 Piscinas & Mantenimiento',
        fitness_estetica: '🏋️ Fitness, Estética & Barberías',
        climatizacion_seguridad: '❄️ Climatización & Alarmas',
        empresas_logistica: '🏭 Empresas, Logística & Ferreterías',
        nautica: '⚓ Náutica & Guarderías',
        estetica: '✂️ Estética & Barberías',
        mecanica: '🚗 Talleres & Detailing',
        salud: '🩺 Odontología & Salud',
        veterinaria: '🐾 Veterinarias & Pets',
        hogar: '🛋️ Hogar & Piletas',
        fitness: '🏋️ Fitness & Pilates'
      };

      Object.entries(catCounts).forEach(([cat, count]) => {
        const displayName = catNames[cat] || cat;
        pillsHtml += `<button type="button" class="cat-pill-btn ${activeCategory === cat ? 'active' : ''}" data-cat="${cat}">${displayName} (${count})</button>`;
      });

      catPillsRow.innerHTML = pillsHtml;

      catPillsRow.querySelectorAll('.cat-pill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          catPillsRow.querySelectorAll('.cat-pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeCategory = btn.getAttribute('data-cat');
          renderLeads();
        });
      });
    }

    function switchCampaign(campaignKey) {
      activeCampaign = campaignKey;
      activeCategory = 'all';
      
      document.getElementById('tabEscobar')?.classList.toggle('active', campaignKey === 'escobar');
      document.getElementById('tabPilar')?.classList.toggle('active', campaignKey === 'pilar');
      document.getElementById('tabNordelta').classList.toggle('active', campaignKey === 'nordelta');

      document.getElementById('searchInput').value = '';
      document.getElementById('statusFilterSelect').value = 'all';
      document.getElementById('profileSelect').value = 'all';

      populateFilters();
      updateKpis();
      renderLeads();
    }

    function renderLeads() {
      const leads = DATASETS[activeCampaign];
      const statuses = getStatuses();
      const container = document.getElementById('leadsContainer');

      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
      const selectedZone = document.getElementById('zoneSelect').value;
      const selectedStatus = document.getElementById('statusFilterSelect').value;
      const selectedProfile = document.getElementById('profileSelect').value;

      const webFilterEl = document.getElementById('webFilterSelect');
      const selectedWebFilter = webFilterEl ? webFilterEl.value : 'all';
    

      const filtered = leads.filter(l => {
        if (activeCategory !== 'all' && l.category !== activeCategory) return false;
        if (selectedZone !== 'all' && l.zone !== selectedZone) return false;
        if (selectedProfile !== 'all' && l.profile !== selectedProfile) return false;

        if (selectedWebFilter === 'sin_web' && l.hasRealWeb) return false;
        if (selectedWebFilter === 'con_web' && !l.hasRealWeb) return false;
    

        const currentStatus = statuses[l.id] || 'pendiente';
        if (selectedStatus !== 'all' && currentStatus !== selectedStatus) return false;

        if (searchTerm) {
          const blob = `${l.name} ${l.rubro} ${l.address} ${l.zone} ${l.categoryName || ''} ${l.profileLabel || ''} ${l.profileChip || ''}`.toLowerCase();
          if (!blob.includes(searchTerm)) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <h4>No se encontraron comercios con esos filtros</h4>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Probá limpiando el buscador o seleccionando otra categoría o zona.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(lead => {
        const currentStatus = statuses[lead.id] || 'pendiente';
        const waEncodedText = encodeURIComponent(lead.pitch);
        const waUrl = `https://wa.me/${lead.phone}?text=${waEncodedText}`;

        return `
          <div class="lead-card ${currentStatus === 'invalido' ? 'status-invalido' : ''}" id="card-${lead.id}">
            <div class="lead-card-header">
              <div class="lead-title-box">
                <h3>${lead.name}</h3>
                <div class="lead-meta-chips">
                  <span class="badge-chip profile">${lead.profileChip || '🏪 Comercio Local'}</span>
                  <span class="badge-chip rubro">${lead.rubro}</span>
                  <span class="badge-chip zone">📍 ${lead.zone}</span>
                  <span class="badge-chip web-status">${lead.webBadge}</span>
                  <span class="badge-chip ${lead.isMobile ? 'mobile-wa' : 'phone-landline'}">${lead.isMobile ? '📱 WhatsApp' : '☎️ Teléfono'}</span>
                </div>
              </div>

              <select 
                id="status-${lead.id}" 
                class="status-badge-select ${currentStatus}"
                onchange="saveStatus('${lead.id}', this.value); this.className = 'status-badge-select ' + this.value; document.getElementById('card-${lead.id}').classList.toggle('status-invalido', this.value === 'invalido');"
              >
                <option value="pendiente" ${currentStatus === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
                <option value="enviado" ${currentStatus === 'enviado' ? 'selected' : ''}>📤 Enviado</option>
                <option value="conversacion" ${currentStatus === 'conversacion' ? 'selected' : ''}>💬 En Chat</option>
                <option value="cerrado" ${currentStatus === 'cerrado' ? 'selected' : ''}>🎉 Cerrado</option>
                <option value="invalido" ${currentStatus === 'invalido' ? 'selected' : ''}>⚠️ WhatsApp no funciona</option>
              </select>
            </div>

            <div class="lead-address">
              <span>📍 <strong>Dirección:</strong> ${lead.address}</span>
            </div>

            <a href="${lead.mapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-gmaps">
              🗺️ Ver ficha en Google Maps ↗
            </a>

            <div class="lead-diagnosis">
              <strong>Diagnóstico Detectado:</strong><br/>
              ${lead.diagnosis}
            </div>

            <div class="pitch-box-preview" title="Mensaje personalizado">
${lead.pitch.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
            </div>

            <div class="lead-actions-row">
              <a 
                href="${waUrl}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="btn-wa-direct"
                onclick="handleWaClick('${lead.id}')"
              >
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.699c.971.531 1.769.814 2.796.814 3.181 0 5.767-2.586 5.768-5.766 0-3.18-2.587-5.766-5.768-5.766zm6.817 5.766c-.002 3.759-3.059 6.816-6.818 6.816-1.19 0-2.312-.314-3.291-.861l-3.649.957.974-3.557c-.604-.997-.954-2.164-.955-3.355.002-3.759 3.059-6.816 6.818-6.816 3.759 0 6.819 3.057 6.821 6.816z"/>
                </svg>
                <span>Abrir WhatsApp (${lead.displayPhone})</span>
              </a>

              <button type="button" class="btn-copy-pitch" onclick="copyPitch('${lead.id}')">
                📋 Copiar
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Attach Event Listeners
    document.getElementById('searchInput').addEventListener('input', renderLeads);
    document.getElementById('zoneSelect').addEventListener('change', renderLeads);
    document.getElementById('statusFilterSelect').addEventListener('change', renderLeads);
    document.getElementById('profileSelect').addEventListener('change', renderLeads);

    // Initial load
    populateFilters();
    updateKpis();
    renderLeads();
  </script>
</body>
</html>
