<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Prospección 100 Locales | Pilar & Nordelta | Primera Cuadra</title>
  <meta name="description" content="Dashboard de prospección comercial directa para comercios de Pilar, Nordelta y Zona Norte sin página web propia. Mensajes personalizados con 1 clic a WhatsApp." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-purple: #673de6;
      --brand-purple-dark: #5025d1;
      --brand-purple-light: #f3f0ff;
      --brand-purple-soft: #ede9fe;
      --brand-purple-glow: rgba(103, 61, 230, 0.25);
      --green-wa: #25d366;
      --green-wa-dark: #128c7e;
      --green-wa-light: #e8f8f0;
      --text-dark: #0f172a;
      --text-title: #1e293b;
      --text-body: #334155;
      --text-muted: #64748b;
      --bg-light: #f8fafc;
      --border-color: #e2e8f0;
      --border-focus: #c4b5fd;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-card: 0 4px 14px rgba(0,0,0,0.05);
      --shadow-hover: 0 10px 25px rgba(103, 61, 230, 0.12);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-light);
      color: var(--text-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* Top Bar */
    .top-header {
      background: linear-gradient(135deg, #140d2b 0%, #1e133d 100%);
      color: #ffffff;
      padding: 24px 20px;
      border-bottom: 1px solid rgba(147, 51, 234, 0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .top-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand-group h1 {
      font-family: var(--font-heading);
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .brand-group p {
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .campaign-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px;
      border-radius: var(--radius-full);
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .campaign-tab {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .campaign-tab:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    .campaign-tab.active {
      background: var(--brand-purple);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(103, 61, 230, 0.4);
    }

    /* Main Container */
    .main-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* KPI Metrics Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: #ffffff;
      padding: 18px 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .kpi-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .kpi-icon.total { background: #eff6ff; color: #3b82f6; }
    .kpi-icon.sent { background: #fef3c7; color: #d97706; }
    .kpi-icon.chat { background: #dbeafe; color: #2563eb; }
    .kpi-icon.won { background: #dcfce7; color: #16a34a; }

    .kpi-info strong {
      display: block;
      font-family: var(--font-heading);
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.1;
    }

    .kpi-info span {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Filters Section */
    .filter-card {
      background: #ffffff;
      padding: 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .filter-top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-box-wrap {
      flex: 2 1 280px;
      position: relative;
    }

    .search-icon-svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.95rem;
      background: #ffffff;
      transition: all 0.2s ease;
      color: var(--text-dark);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--brand-purple);
      box-shadow: 0 0 0 3px var(--brand-purple-glow);
    }

    .select-wrap {
      flex: 1 1 180px;
    }

    .custom-select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.92rem;
      background: #ffffff;
      color: var(--text-dark);
      cursor: pointer;
      font-weight: 600;
    }

    .custom-select:focus {
      outline: none;
      border-color: var(--brand-purple);
    }

    .category-pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-pill-btn {
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-body);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cat-pill-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .cat-pill-btn.active {
      background: var(--brand-purple);
      color: #ffffff;
      border-color: var(--brand-purple);
      box-shadow: 0 2px 8px var(--brand-purple-glow);
    }

    /* Leads Grid */
    .leads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    .lead-card {
      background: #ffffff;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .lead-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-focus);
    }

    .lead-card.status-invalido {
      opacity: 0.65;
      background: #fdf2f2;
      border-color: #fecaca;
    }

    .lead-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .lead-title-box h3 {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 6px;
      line-height: 1.25;
    }

    .lead-meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge-chip {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-chip.profile {
      background: #fdf4ff;
      color: #9333ea;
      border: 1px solid #f0abfc;
      font-weight: 800;
    }

    .badge-chip.rubro {
      background: var(--brand-purple-light);
      color: var(--brand-purple-dark);
    }

    .badge-chip.zone {
      background: #f1f5f9;
      color: #475569;
    }

    .badge-chip.web-status {
      background: #fef2f2;
      color: #b91c1c;
    }

    .badge-chip.mobile-wa {
      background: var(--green-wa-light);
      color: var(--green-wa-dark);
    }

    .badge-chip.phone-landline {
      background: #f8fafc;
      color: #64748b;
      border: 1px solid #cbd5e1;
    }

    .status-badge-select {
      padding: 5px 8px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      background-color: #ffffff;
    }

    .status-badge-select.pendiente { background-color: #f8fafc; color: #475569; }
    .status-badge-select.enviado { background-color: #fef3c7; color: #b45309; }
    .status-badge-select.conversacion { background-color: #dbeafe; color: #1d4ed8; }
    .status-badge-select.cerrado { background-color: #dcfce7; color: #15803d; }
    .status-badge-select.invalido { background-color: #fee2e2; color: #b91c1c; }

    .lead-address {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .btn-gmaps {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--brand-purple);
      text-decoration: none;
      margin-bottom: 12px;
      transition: color 0.15s;
    }

    .btn-gmaps:hover {
      color: var(--brand-purple-dark);
      text-decoration: underline;
    }

    .lead-diagnosis {
      background: #f8fafc;
      border-left: 3px solid #cbd5e1;
      padding: 8px 12px;
      font-size: 0.82rem;
      color: #475569;
      border-radius: 0 6px 6px 0;
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .pitch-box-preview {
      background: #fdfdfd;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.78rem;
      color: #334155;
      line-height: 1.45;
      max-height: 130px;
      overflow-y: auto;
      margin-bottom: 14px;
      font-family: monospace;
      white-space: pre-wrap;
    }

    .lead-actions-row {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .btn-wa-direct {
      flex: 1;
      background: var(--green-wa);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(37, 211, 102, 0.3);
    }

    .btn-wa-direct:hover {
      background: #20bd5a;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
    }

    .btn-copy-pitch {
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      color: var(--text-body);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-copy-pitch:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-copy-pitch:active {
      background: var(--brand-purple-light);
      color: var(--brand-purple);
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: var(--radius-full);
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10000;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-color);
    }

    @media (max-width: 768px) {
      .leads-grid { grid-template-columns: 1fr; }
      .filter-top-row { flex-direction: column; }
      .brand-group h1 { font-size: 1.45rem; }
      .campaign-tabs { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <div class="top-header-inner">
      <div class="brand-group">
        <h1>CRM Prospección Primera Cuadra</h1>
        <p>Prospección comercial directa a negocios reales en Google Maps segmentados por perfil</p>
      </div>

      <!-- Campaign Switcher -->
      <div class="campaign-tabs">
        <button type="button" class="campaign-tab active" id="tabEscobar" onclick="switchCampaign('escobar')">
          📍 Escobar & Alrededores (50)
        </button>
        <button type="button" class="campaign-tab" id="tabPilar" onclick="switchCampaign('pilar')">
          📍 Pilar & Alrededores (50)
        </button>
        <button type="button" class="campaign-tab" id="tabNordelta" onclick="switchCampaign('nordelta')">
          📍 Nordelta & Zona Norte (49)
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-wrap">

    <!-- KPI Metrics -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon total">🎯</div>
        <div class="kpi-info">
          <strong id="kpi-total">50</strong>
          <span>Total Comercios</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon sent">📤</div>
        <div class="kpi-info">
          <strong id="kpi-sent">0</strong>
          <span>Mensajes Enviados</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon chat">💬</div>
        <div class="kpi-info">
          <strong id="kpi-chat">0</strong>
          <span>En Conversación</span>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon won">💰</div>
        <div class="kpi-info">
          <strong id="kpi-won">0</strong>
          <span>Cerrados ($250k c/u)</span>
        </div>
      </div>
    </div>

    <!-- Filter Card -->
    <div class="filter-card">
      <div class="filter-top-row">
        <div class="search-box-wrap">
          <svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Buscar por nombre de negocio, rubro, dirección o perfil..." 
          />
        </div>

        <div class="select-wrap">
          <select id="profileSelect" class="custom-select">
            <option value="all" selected>🏷️ Todos los Perfiles</option>
            <option value="empresa_prestigio">👑 Empresas con Prestigio</option>
            <option value="micropyme_local">🏪 MicroPyMEs / Talleres</option>
            <option value="b2b_industrial_obra">🏗️ Proveedores B2B / Obra</option>
            <option value="franquicia_cadena">🏢 Franquicias / Cadenas</option>
          </select>
        </div>

        <div class="select-wrap">
          <select id="zoneSelect" class="custom-select">
            <!-- Populated dynamically -->
          </select>
        </div>

        <div class="select-wrap">
          <select id="statusFilterSelect" class="custom-select">
            <option value="all">⚡ Todos los Estados</option>
            <option value="pendiente">⏳ Pendiente</option>
            <option value="enviado">📤 Mensaje Enviado</option>
            <option value="conversacion">💬 En Conversación</option>
            <option value="cerrado">🎉 Cerrado / Cliente</option>
            <option value="invalido">⚠️ WhatsApp no funciona</option>
          </select>
        </div>
      </div>

      <!-- Categories Pills Row -->
      <div class="category-pills-row" id="catPillsRow">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Lead Cards Grid -->
    <div class="leads-grid" id="leadsContainer"></div>

  </main>

  <!-- Toast -->
  <div id="toast" class="toast-msg">
    <span>✓ Mensaje copiado al portapapeles</span>
  </div>

  <script>

      const currentLeads = DATASETS[activeCampaign];
      const lead = currentLeads.find(l => l.id === id);

        showToast("✓ Mensaje de Ricardo copiado al portapapeles");
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = lead.pitch;

        ta.select();

        document.body.removeChild(ta);
        showToast("✓ Mensaje copiado");
      });

      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function updateKpis() {
      const leads = DATASETS[activeCampaign];
      const st = getStatuses();

      let sent = 0;
      let chat = 0;
      let won = 0;

      leads.forEach(l => {
        const s = st[l.id];
        if (s === 'enviado') sent++;
        else if (s === 'conversacion') chat++;
        else if (s === 'cerrado') won++;
      });

      document.getElementById('kpi-total').textContent = leads.length;
      document.getElementById('kpi-sent').textContent = sent;
      document.getElementById('kpi-chat').textContent = chat;
      document.getElementById('kpi-won').textContent = `${won} (${won * 250}k)`;

                onchange="saveStatus('${lead.id}', this.value); this.className = 'status-badge-select ' + this.value; document.getElementById('card-${lead.id}').classList.toggle('status-invalido', this.value === 'invalido');"
              >
                <option value="pendiente" ${currentStatus === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
                <option value="enviado" ${currentStatus === 'enviado' ? 'selected' : ''}>📤 Enviado</option>
                <option value="conversacion" ${currentStatus === 'conversacion' ? 'selected' : ''}>💬 En Chat</option>
                <option value="cerrado" ${currentStatus === 'cerrado' ? 'selected' : ''}>🎉 Cerrado</option>
                <option value="invalido" ${currentStatus === 'invalido' ? 'selected' : ''}>⚠️ WhatsApp no funciona</option>
              </select>
            </div>

            <div class="lead-address">
              <span>📍 <strong>Dirección:</strong> ${lead.address}</span>
            </div>

            <a href="${lead.mapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-gmaps">
              🗺️ Ver ficha en Google Maps ↗
            </a>

            <div class="lead-diagnosis">
              <strong>Diagnóstico Detectado:</strong><br/>
              ${lead.diagnosis}
            </div>

            <div class="pitch-box-preview" title="Mensaje personalizado">
${lead.pitch.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
            </div>

            <div class="lead-actions-row">
              <a 
                href="${waUrl}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="btn-wa-direct"
                onclick="handleWaClick('${lead.id}')"
              >
                <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.711 2.598 2.664-.699c.971.531 1.769.814 2.796.814 3.181 0 5.767-2.586 5.768-5.766 0-3.18-2.587-5.766-5.768-5.766zm6.817 5.766c-.002 3.759-3.059 6.816-6.818 6.816-1.19 0-2.312-.314-3.291-.861l-3.649.957.974-3.557c-.604-.997-.954-2.164-.955-3.355.002-3.759 3.059-6.816 6.818-6.816 3.759 0 6.819 3.057 6.821 6.816z"/>
                </svg>
                <span>Abrir WhatsApp (${lead.displayPhone})</span>
              </a>

              <button type="button" class="btn-copy-pitch" onclick="copyPitch('${lead.id}')">
                📋 Copiar
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Attach Event Listeners
    document.getElementById('searchInput').addEventListener('input', renderLeads);
    document.getElementById('zoneSelect').addEventListener('change', renderLeads);
    document.getElementById('statusFilterSelect').addEventListener('change', renderLeads);
    document.getElementById('profileSelect').addEventListener('change', renderLeads);

    // Initial load
    populateFilters();
    updateKpis();
    renderLeads();
  </script>
</body>
</html>
